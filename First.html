<!DOCTYPE html>

    <style>
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: sans-serif;
            font-weight: 500;
        }

        .right ul {
            display: flex;
            gap: 20px;
            margin-right: 20px
        }

        .right ul li {
            list-style: none;
            display: flex;
            align-items: center;
        }

        .right ul li span {
            padding: 0px 3px;
        }

        .price {
            border-radius: 100px;
            background-color: #4353ff;
            font-size: 15px;
            padding: 15px 20px;
            color: white;
            font-family: monospace;
            border: none;
            font-weight: 500;
        }

        .main h1 {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 65px;
            font-weight: 500;
            text-align: center;
            max-width: 90%;
            margin: auto;
        }

        .main h1 span {
            color: #4353ff;
            font-family: 'Times New Roman', Times, serif;
            font-style: italic;
        }

        .main-small {
            text-align: center;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            font-size: 20px;
            width: 40%;
            margin-bottom: 50px;
        }

        .main-small h5 {
            font-weight: 100;
            color: #757575;
        }

        .section-1 {
            margin-top: 50px;
        }

        .section-2 {
            display: flex;
            justify-content: center;
        }

        .video-player {
            z-index: 100;
            width: 95%;
            border-radius: 25px;
        }

        .behind-section {
            background-color: #000970;
            height: 650px;
            border-radius: 25px;
            margin-top: -400px;
            width: 98%;
        }

        .video-class {
            display: flex;
            justify-content: center;
        }
        .video-player video{
            border-radius: 50px;
            box-shadow: none;
        }
        .behind-section-center{
            display: flex;
            justify-content: center;
        }
    </style>
</head>
